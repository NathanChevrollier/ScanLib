name: scanlib

# Pile complète pour un VPS : PostgreSQL, l'API Node, le front statique et
# Caddy en frontal (HTTPS automatique via Let's Encrypt).
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scanlib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL manquant}
      POSTGRES_DB: ${POSTGRES_DB:-scanlib}
      # Le tri par titre doit ignorer la casse et les accents comme en français.
      LANG: fr_FR.utf8
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-scanlib} -d ${POSTGRES_DB:-scanlib}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [scanlib]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanlib}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanlib}
      # Front et API partagent l'origine derrière Caddy : les cookies de session
      # restent en première partie, sans configuration inter-domaines.
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?secret JWT manquant}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-false}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      DEFAULT_WATCH_REGIONS: ${DEFAULT_WATCH_REGIONS:-FR,US}
      DEFAULT_LANGUAGES: ${DEFAULT_LANGUAGES:-fr,en}
      ENABLE_ANILIST: ${ENABLE_ANILIST:-true}
      PROVIDER_USER_AGENT: ${PROVIDER_USER_AGENT:-ScanLib/0.1 (self-hosted)}
      ENABLE_JOBS: ${ENABLE_JOBS:-true}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      # Notifications poussées : générer la paire avec
      #   npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
    # Les migrations tournent au démarrage : un déploiement se résume à
    # reconstruire l'image et relancer le service.
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    networks: [scanlib]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    # Conteneur éphémère : il copie le build dans le volume servi par Caddy.
    restart: 'no'
    volumes:
      - web-dist:/srv/web
    networks: [scanlib]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web-dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Caddy peut échouer à obtenir son certificat sans que le conteneur meure :
      # la sonde le signale au lieu de laisser un site injoignable en silence.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [scanlib]

volumes:
  web-dist:
  caddy-data:
  caddy-config:

networks:
  scanlib:
    driver: bridge
